<section class="overview" aria-label="当月整体进度"><div class="gmv-block"><div class="eyebrow">GMV实绩</div><div class="main-value" id="headline-gmv">—</div><div class="metrics-inline"><div class="metric-item"><span>全月目标</span><b id="headline-target">—</b></div><div class="metric-item" id="rate-item"><span>完成率</span><b id="headline-rate">—</b></div><div class="metric-item" id="gap-item"><span>距目标</span><b id="headline-gap">—</b></div></div><div class="progress-track" role="progressbar" id="gmv-progress" aria-label="GMV目标完成进度" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progress-fill"></div></div></div><div class="daily-block"><div class="eyebrow">店日均</div><div class="daily-value" id="headline-daily">—</div><div class="daily-foot" id="daily-target">目标 —</div><div class="daily-foot daily-denom" id="daily-denom"></div></div></section>
<section class="trend-section" aria-labelledby="trend-title"><div class="section-top"><div class="section-label" id="trend-title">每日实绩</div><div class="trend-tabs" id="trend-tabs" role="group" aria-label="趋势指标"><button type="button" data-trend="gmv" class="active">GMV</button><button type="button" data-trend="daily">店日均</button></div></div><div class="chart-meta" id="chart-meta">仅显示已有实绩</div><div class="chart-wrap" id="trend-chart" aria-label="每日实际趋势图"></div></section>

<details class="source-details"><summary>数据口径</summary><p>GMV实际来自截至2026年10月14日的逐店日汇总；店日均按实际GMV合计 ÷ 实际店天合计计算。预算按已选月份与档位展示；缺少单店目标时标为“未设目标”。当月门店经理归属依据预算经理及已确认的同省唯一经理规则。页面为静态快照。</p></details>
</div>

<script>
(()=>{'use strict';
const raw=Uint8Array.from(atob(PROGRESS_DATA_B64),c=>c.charCodeAt(0));
new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).json().then(D=>{
if(!D||D.schema!=='APP_DATA'||D.version!==2){document.body.innerHTML='<p style="padding:24px">数据文件结构不兼容。</p>';return}
const $=s=>document.querySelector(s), months=['09','10','11','12'], mNames={'09':'9月','10':'10月','11':'11月','12':'12月'}, dims=D.dictionaries, tierNames=D.meta.tiers, srows=D.stores, brows=D.budgets, drows=D.daily;
const state={month:'10',tier:1,region:-1,division:-1,manager:-1,province:-1,view:'manager',trend:'gmv',search:'',dialogGroup:null,page:1,pageSize:15,mainPage:1,mainPageSize:25,sortByView:{division:{key:'actual',dir:'desc',locked:false,order:[]},manager:{key:'actual',dir:'desc',locked:false,order:[]},province:{key:'actual',dir:'desc',locked:false,order:[]},store:{key:'actual',dir:'desc',locked:false,order:[]}}};
const SORTS=[['actualStores','实绩门店'],['actual','GMV实绩'],['goal','全月目标'],['rate','完成率'],['daily','店日均']];
const DETAIL_SORTS=[['actual','GMV实绩'],['goal','全月目标'],['rate','完成率'],['daily','店日均']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x==null?null:Number(x), fmt=(x,d=2)=>x==null?'—':Number(x).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}), wan=x=>x==null?'—':fmt(x/10000)+' 万元', rate=(a,t)=>t>0?a/t:null, pct=x=>x==null?'—':fmt(x*100,1)+'%';
function target(s,mi=months.indexOf(state.month),ti=state.tier){const b=brows.find(x=>x[0]===s&&x[1]===mi);return b?num(b[2][ti]):null}function targetDays(s,mi=months.indexOf(state.month),ti=state.tier){const b=brows.find(x=>x[0]===s&&x[1]===mi);return b?num(b[3][ti]):null}
let budgetStoreIndices=new Set();
function storeObj(i){const r=srows[i],monthIndex=months.indexOf(state.month),mgr=r[5][monthIndex],records=num(r[8][monthIndex])||0;return {i,code:r[0],name:r[1]||`门店 ${r[0]}`,region:r[2],province:r[3],division:r[4],manager:mgr,actual:num(r[6][monthIndex]),days:num(r[7][monthIndex]),goal:target(i),goalDays:targetDays(i),records,hasActual:records>0,isBudgeted:budgetStoreIndices.has(i)}}
const ids={region:i=>dims.regions[i]||'未提供',province:i=>dims.provinces[i]||'未提供',division:i=>dims.divisions[i]||'未提供',manager:i=>dims.managers[i]||'未提供'};
function filteredStores(includeSearch=true){return srows.map((_,i)=>storeObj(i)).filter(s=>(s.isBudgeted||s.hasActual)&&(state.region<0||s.region===state.region)&&(state.division<0||s.division===state.division)&&(state.manager<0||s.manager===state.manager)&&(state.province<0||s.province===state.province)&&(!includeSearch||!state.search||`${s.name} ${s.code}`.toLowerCase().includes(state.search.toLowerCase())))}
function sum(items){const actual=items.reduce((a,s)=>a+(s.actual||0),0),days=items.reduce((a,s)=>a+(s.days||0),0),goal=items.reduce((a,s)=>a+(s.goal||0),0),goalDays=items.reduce((a,s)=>a+(s.goalDays||0),0),hasGoal=items.some(s=>s.goal!=null),hasActual=items.some(s=>s.hasActual);return {actual:hasActual?actual:null,days:hasActual?days:null,goal:hasGoal?goal:null,goalDays:hasGoal?goalDays:null,rate:hasGoal&&goal>0&&hasActual?actual/goal:null,daily:hasActual&&days>0?actual/days:null,dailyGoal:hasGoal&&goalDays>0?goal/goalDays:null,stores:items.length,actualStores:items.filter(s=>s.hasActual).length}}
function compareActualDesc(a,b){return a.actual==null?(b.actual==null?0:1):b.actual==null?-1:b.actual-a.actual}
function groupData(){const list=filteredStores();if(state.view==='store')return list.map(s=>({...s,label:s.name,children:[s]})).sort(compareActualDesc);const key={division:'division',manager:'manager',province:'province'}[state.view];const map=new Map;for(const s of list){const id=s[key];if(!map.has(id))map.set(id,[]);map.get(id).push(s)}return [...map.entries()].map(([id,children])=>({id,label:ids[key](id),children,...sum(children)})).sort(compareActualDesc)}
function sortState(){return state.sortByView[state.view]}
function stableRowKey(row){return state.view==='store'?String(row.code):String(row.id)}
function rowMetric(row,key){return (state.view==='store'?sum([row]):row)[key]}
function compareMetric(a,b,key,dir){const av=rowMetric(a,key),bv=rowMetric(b,key);if(av==null)return bv==null?0:1;if(bv==null)return -1;return (av-bv)*(dir==='asc'?1:-1)}
function visibleRows(){const rows=groupData(),sort=sortState(),rank=new Map(sort.order.map((key,i)=>[key,i]));return rows.map((row,index)=>({row,index,key:stableRowKey(row)})).sort((a,b)=>{if(sort.locked){const ar=rank.has(a.key)?rank.get(a.key):Infinity,br=rank.has(b.key)?rank.get(b.key):Infinity;if(ar!==br)return ar-br;if(ar===Infinity){const byMetric=compareMetric(a.row,b.row,sort.key,sort.dir);if(byMetric)return byMetric}}else{const byMetric=compareMetric(a.row,b.row,sort.key,sort.dir);if(byMetric)return byMetric}return a.index-b.index}).map(item=>item.row)}
function sortHeader(key,label){const s=sortState(),active=s.key===key,aria=active?(s.dir==='asc'?'ascending':'descending'):'none',arrow=active?(s.dir==='asc'?'↑':'↓'):'↕',direction=s.dir==='asc'?'升序':'降序';return `<th aria-sort="${aria}"><button type="button" class="sort-btn" data-sort="${key}" ${s.locked?'disabled aria-disabled="true"':''} aria-label="按${label}排序${active?'，当前'+direction:''}"><span>${label}</span><span class="sort-chevron" aria-hidden="true">${arrow}</span></button></th>`}
function setMainSort(key,dir){const s=sortState();if(s.locked)return;if(dir){s.key=key;s.dir=dir}else if(s.key===key){s.dir=s.dir==='desc'?'asc':'desc'}else{s.key=key;s.dir='desc'}state.mainPage=1;render()}
