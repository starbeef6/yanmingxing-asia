name: Chat regression checks

on:
  push:
    paths:
      - '*.html'
      - 'operations/**'
      - 'assets/mascot.*'
      - 'assets/chat-*.js'
      - 'assets/operations-diagnosis.js'
      - 'tools/chat-ui-check/**'
      - 'tools/operations-chat/**'
      - 'tools/operations-chat-cloud/**'
      - '.github/workflows/chat-regression.yml'
  pull_request:
    paths:
      - '*.html'
      - 'operations/**'
      - 'assets/mascot.*'
      - 'assets/chat-*.js'
      - 'assets/operations-diagnosis.js'
      - 'tools/chat-ui-check/**'
      - 'tools/operations-chat/**'
      - 'tools/operations-chat-cloud/**'
      - '.github/workflows/chat-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify all chat entry points and UI behavior
        run: |
          python3 tools/chat-ui-check/stamp-chat-assets.py
          for test in tools/chat-ui-check/*.test.cjs; do node "$test"; done
      - name: Verify relay delivery and fixed model policy
        run: |
          python3 -m unittest discover -s tools/operations-chat/tests
          python3 -m unittest discover -s tools/operations-chat-cloud/tests
