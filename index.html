<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <title>数据处理中心</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/mascot.css?v=4b41b535fff8">
</head>
<body>
  <main class="app-shell" data-page="departments">
    <nav class="brand-bar" aria-label="站点导航">
      <span class="brand">数据处理中心</span>
      <span class="quiet-label">Cloud Processing</span>
    </nav>

    <header class="page-header">
      <h1>选择工作台</h1>
      <p>查看预算与经营情况，或处理部门文件</p>
    </header>

    <section class="choice-list" aria-label="预算与经营">
      <a class="choice-row" href="budget/" aria-label="进入全国预算总览">
        <span class="choice-icon" style="--icon-bg:#f4ece3;--icon-color:#946044">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v3M16 3v3M4 9h16M8 13h3M8 17h3M15 13h1M15 17h1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span class="choice-copy"><h2>全国预算总览</h2><p>9—12月预算目标，按大区、经理和门店查看</p></span>
        <svg class="choice-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="choice-row" href="operations/" aria-label="进入经营观察">
        <span class="choice-icon" style="--icon-bg:#e8f2ec;--icon-color:#2c6656">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4v16h16M8 15v-4M12 15V8M16 15V5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="choice-copy"><h2>经营观察</h2><p>全国与五区的 GMV、店日均和目标进度。</p></span>
        <svg class="choice-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="choice-row" href="manager-targets/" aria-label="进入经营进度">
        <span class="choice-icon" style="--icon-bg:#e9eef4;--icon-color:#4e6881">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 20v-2a5.5 5.5 0 0 1 11 0v2M16 6h5M16 10h5M18 14v6M15 17h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span class="choice-copy"><h2>经营进度</h2><p>按事业部、省份、经理和门店查看实绩与目标</p></span>
        <svg class="choice-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>
    <section class="choice-list" data-department-list aria-label="部门列表"></section>
  </main>
  <script src="assets/catalog.js"></script>
  <script src="assets/portal.js"></script>
  <script src="assets/operations-diagnosis.js?v=20261012-c32" defer></script>
  <script src="assets/chat-context.js?v=20261012-c32-r2" defer></script>
  <script src="assets/chat-session.js?v=20261012-c32" defer></script>
  <script src="assets/chat-config.js?v=12b940a2179a" defer></script>
  <script src="assets/mascot.js?v=52214c8634c3" defer></script>
</body>
</html>
